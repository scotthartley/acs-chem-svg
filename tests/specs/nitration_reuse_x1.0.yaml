# M5: m4_nitration_x1.0 with species reused by name (nitronium is drawn twice, sulfuric is
# reused for the omitted product of step 5) and nitronium without `align: false`; must render the
# same pixels as the original.
preset: acs1996
species:
  nitric:       {smiles: "[O:1]=[N+:2]([O-:3])[OH:4]", orientation: {flip_h: true}}
  sulfuric:     {smiles: "[O:5]=[S:6](=[O:7])([OH:8])[O:9][H:10]"}
  nitric_h:     {smiles: "[O:1]=[N+:2]([O-:3])[OH+:4][H:10]"}
  bisulfate:    {smiles: "[O:5]=[S:6](=[O:7])([OH:8])[O-:9]"}
  nitronium:    {smiles: "[O:1]=[N+:2]=[O:3]"}   # stays linear: an alignment that bends it is dropped
  water:        {smiles: "[H:10][OH:4]"}
  benzene:      {smiles: "[CH:11]1=[CH:12][CH:13]=[CH:14][CH:15]=[CH:16]1", orientation: {rotate: 180}}
  sigma_a:      {smiles: "[H:17][C:11]1([N+:2](=[O:3])[O-:1])[CH+:12][CH:13]=[CH:14][CH:15]=[CH:16]1"}
  sigma_b:      {smiles: "[H:17][C:11]1([N+:2](=[O:3])[O-:1])[CH:12]=[CH:13][CH+:14][CH:15]=[CH:16]1"}
  sigma_c:      {smiles: "[H:17][C:11]1([N+:2](=[O:3])[O-:1])[CH:12]=[CH:13][CH:14]=[CH:15][CH+:16]1"}
  nitrobenzene: {smiles: "[O-:1][N+:2](=[O:3])[C:11]1=[CH:16][CH:15]=[CH:14][CH:13]=[CH:12]1"}
steps:
  - from: [nitric, sulfuric]
    over: [sulfuric]
    to: [nitric_h, bisulfate]
    omit: [bisulfate]
    arrows:
      - {from: "lp(4)", to: "between(4,10)"}
      - {from: "bond(9-10)", to: "atom(9)"}
  - from: nitric_h
    to: [nitronium, water]
    omit: [water]
    above: "−H2O"
    arrows:
      - {from: "lp(3)", to: "between(2,3)"}
      - {from: "bond(2-4)", to: "atom(4)"}
  - new_row: true
    from: [benzene, nitronium]
    to: sigma_a
    arrows:
      - {from: "bond(11=12)", to: "between(11,2)"}
      - {from: "bond(2=1)", to: "atom(1)"}
  - resonance: [sigma_a, sigma_b, sigma_c]
    arrows:
      - [{from: "bond(13=14)", to: "between(12,13)"}]
      - [{from: "bond(15=16)", to: "between(14,15)"}]
  - from: [sigma_c, bisulfate]
    to: [nitrobenzene, sulfuric]
    omit: [sulfuric]
    arrows:
      - {from: "lp(9)", to: "between(9,17)"}
      - {from: "bond(11-17)", to: "between(11,16)"}
