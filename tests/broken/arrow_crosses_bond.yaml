# expect: curved-arrow-step-1-0 crosses a bond of etbr
# E2 with the base's arrow forced nearly straight from the lower lone pair, through the zigzag to the H.
# etbr is turned so H4 sits beyond the chain (C3 draws all three H's since 2026-10-26).
preset: acs1996
species:
  hydroxide: {smiles: "[H][O-:1]"}
  etbr:      {smiles: "[H:4][CH2:3][CH2:2][Br:5]", orientation: {rotate: -60}}
  water:     {smiles: "[H:4][O:1][H]"}
  ethene:    {smiles: "[CH2:3]=[CH2:2]"}
  bromide:   {smiles: "[Br-:5]"}
steps:
  - from: [hydroxide, etbr]
    to: [water, ethene, bromide]
    arrows:
      - {from: "lp(1)", to: "between(1,4)"}
      - {from: "bond(3-4)", to: "between(2,3)"}
      - {from: "bond(2-5)", to: "atom(5)"}
overrides:
  arrows:
    - {step: 1, index: 0, curvature: 0.02, tail_side: bottom}
