# expect: map number 2 (hydroxide, mebr) is used more than once in the step's reactants
preset: acs1996
species:
  hydroxide: {smiles: "[H:2][O-:1]"}
  mebr:      {smiles: "[CH3:2][Br:3]", show_carbons: terminal}
  methanol:  {smiles: "[OH:1][CH3:2]", show_carbons: terminal}
  bromide:   {smiles: "[Br-:3]"}
steps:
  - from: [hydroxide, mebr]
    to: [methanol, bromide]
    arrows:
      - {from: "lp(1)", to: "between(1,2)"}
      - {from: "bond(2-3)", to: "atom(3)"}
