# expect: atoms 2 and 3 are joined by a single bond, not double (write bond(2-3))
preset: acs1996
species:
  hydroxide: {smiles: "[H][O-:1]"}
  mebr:      {smiles: "[CH3:2][Br:3]", show_carbons: terminal}
  methanol:  {smiles: "[OH:1][CH3:2]", show_carbons: terminal}
  bromide:   {smiles: "[Br-:3]"}
steps:
  - from: [hydroxide, mebr]
    to: [methanol, bromide]
    arrows:
      - {from: "lp(1)", to: "between(1,2)"}
      - {from: "bond(2=3)", to: "atom(3)"}
