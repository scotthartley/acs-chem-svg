# M3: radical bromination, propagation 1: Br· abstracts the tertiary H of isobutane.
# Propagation 2 (tBu· + Br2) is m3_radical_propagation_2_x1.0.yaml: a scheme row is one
# linear chain, so HBr would otherwise have to be carried into the next step.
preset: acs1996
species:
  br:        {smiles: "[Br:1]", show_lone_pairs: [1]}
  isobutane: {smiles: "[CH3:2][C:3]([CH3:4])([CH3:5])[H:6]"}
  hbr:       {smiles: "[H:6][Br:1]"}
  tbu:       {smiles: "[CH3:2][C:3]([CH3:4])[CH3:5]"}
steps:
  - from: [br, isobutane]
    to: [hbr, tbu]
    arrows:
      - {type: fishhook, from: "electron(1)", to: "between(1,6)"}
      - {type: fishhook, from: "bond(3-6)", to: "between(1,6)"}
      - {type: fishhook, from: "bond(3-6)", to: "atom(3)"}
