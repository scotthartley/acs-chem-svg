# Suzuki coupling as a catalytic cycle (acs-style.md §15): the Pd(0) catalyst at 12 o'clock,
# clockwise; aryl bromide and boronic acid enter, B(OH)3 / bromide and the biaryl leave.
# PMe3 ligands in full, bound to Pd by dative bonds (->), drawn as single bonds.
preset: acs1996
species:
  pd0:    {smiles: "CP(C)(C)->[Pd]<-P(C)(C)C"}
  oxadd:  {smiles: "Br[Pd](c1ccccc1)(<-P(C)(C)C)<-P(C)(C)C"}
  trans:  {smiles: "c1ccc(cc1)[Pd](c1ccc(C)cc1)(<-P(C)(C)C)<-P(C)(C)C", align: false}  # aligned to oxadd, the tolyl lands across a PMe3 (chem.prepare)
  biaryl: {smiles: "Cc1ccc(cc1)-c1ccccc1"}
numbers: {pd0: I, oxadd: II, trans: III}
cycle:
  start: pd0
  direction: clockwise
  center: "Pd(0)"
  steps:
    - {from: pd0, to: oxadd, label: oxidative addition, in: PhBr}
    - {from: oxadd, to: trans, label: transmetalation, in: "ArB(OH)2, base", out: "B(OH)3, Br–"}
    - {from: trans, to: pd0, label: reductive elimination, out: {species: biaryl}}
