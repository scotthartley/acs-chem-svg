# M3: SN2, hydroxide + bromomethane (mech_basic_x0.8, with the C-Br arrow added)
preset: acs1996_x0.8
species:
  hydroxide: {smiles: "[H][O-:1]"}
  mebr:      {smiles: "[CH3:2][Br:3]", show_carbons: terminal}
  methanol:  {smiles: "[OH:1][CH3:2]", show_carbons: terminal}
  bromide:   {smiles: "[Br-:3]"}
steps:
  - from: [hydroxide, mebr]
    to: [methanol, bromide]
    arrows:
      - {type: two_electron, from: "lp(1)", to: "between(1,2)"}
      - {type: two_electron, from: "bond(2-3)", to: "atom(3)"}
