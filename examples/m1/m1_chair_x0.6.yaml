# Chair conformers (acs-style.md §14), rendered at preset acs1996_x0.6. Axial / equatorial come from the
# SMILES stereo, with the bulkier groups equatorial (A-values) unless asked otherwise.
preset: acs1996_x0.6
species:
  cis_4_tert_butylcyclohexanol: {smiles: "CC(C)(C)[C@H]1CC[C@@H](O)CC1", chair: true}  # tBu locks the ring: OH axial
  menthol: {smiles: "CC(C)[C@@H]1CC[C@@H](C)C[C@H]1O", chair: true}  # all equatorial
  beta_D_glucopyranose: {smiles: "OC[C@H]1O[C@@H](O)[C@H](O)[C@@H](O)[C@@H]1O", chair: true}
  methylcyclohexane_axial: {smiles: "C[CH:1]1CCCCC1", chair: {flip: true}}  # the minor flip
