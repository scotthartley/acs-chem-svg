  bold_width: 3.6  # settings: style_probe_presentation_x1.0.cdxml BoldWidth
  wedge_wide_end: 5.4  # probe: style_probe_presentation_x1.0.cdxml: wedge polygon width at the drawn end
  hash_line_width: 2.16  # probe: style_probe_presentation_x1.0.cdxml: hash polygon thickness
  hash_spacing: 5.67  # settings: style_probe_presentation_x1.0.cdxml HashSpacing
