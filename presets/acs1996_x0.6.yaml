# ACS Document 1996 with scaled Document Settings, x0.6. All lengths in pt.
# Every value is measured from reference_renders/chemdraw/ by scripts/measure_refs.py;
# see references/acs-style.md for method, ranges, and open items. The `placement:` keys are
# round defaults chosen from those measurements (user decision 2026-10-24).
name: acs1996_x0.6
scale: 0.6
font_family: Helvetica              # m1_set_x1.0.cdxml fonttable; SVG <text> font-family

# Not multiplied by k in the scaled presets (proved by the x0.8 / x0.6 references).
exempt:
  - lengths.line_width              # 0.60 in m1_set_x0.8/x0.6 (bond polygons) and CDXML LineWidth
  - lengths.hash_line_width         # 0.60 in m1_set_x0.8/x0.6 (hash polygons)
  - charge.bar_thickness            # 0.50 in m1_set_x0.8/x0.6
  - arrow.shaft_width               # 0.60 in scheme_basic_x0.8/x0.6
  - arrow.head_length               # 6.00 / 5.98 in scheme_basic_x0.8/x0.6
  - arrow.head_half_width           # 1.575 / 1.569 in scheme_basic_x0.8/x0.6
  - arrow.head_inset                # 5.25 / 5.23 in scheme_basic_x0.8/x0.6
  - arrow.shaft_end_from_tip        # 5.20 / 5.18 in scheme_basic_x0.8/x0.6
  - arrow.head_outline              # 0.05 hairline in all scheme_basic files
  - text.line_pitch_extra           # 10.05 / 8.05 / 6.05 baseline pitch = size + 0.05
  - curved_arrow.stroke_width       # 0.60 in mech_basic_x0.8/x0.6
  - curved_arrow.head_length        # 4.800 / 4.781 in mech_basic_x0.8/x0.6
  - curved_arrow.head_half_width    # 1.500 / 1.494
  - curved_arrow.head_inset         # 4.050 / 4.034
  - curved_arrow.fishhook_barb      # 1.739 / 1.734
  - curved_arrow.fishhook_offset    # 0.240 / 0.241 in mech_basic_x0.8/x0.6
  - bracket.stroke_width            # 0.60 in resonance_x0.8/x0.6
# Measured at every scale but not proportional to k. (ChemDraw's charge bars, 3.935 / 2.733 /
# 1.798, shrink faster than k too; by user decision 2026-10-24 we scale them with k.)
nonlinear:
  - lone_pair.dot_radius            # 0.833 / 0.533 / 0.533 (mech_basic_x*): copied exactly (user decision 2026-10-24)
  - lone_pair.dot_spacing           # 3.75 / 2.40 / 2.40
  - lone_pair.gap                   # placement default, each preset from its own 2.14 / 2.29 / 1.06
  - charge.unlabeled_distance       # placement default, each preset from its own 3.84 / 3.24 / 2.87 (resonance_x*)
# Fitted or chosen, not measured per preset: kept at the x1.0 value.
assumed_exempt:
  - scheme.wrap_width              # 504 pt (7 in, ACS double column) at every preset: user decision 2026-10-25, not k-scaled
  - lengths.label_outline_offset_x  # fitted over x1.0/x0.8/x0.6 together as one fixed-pt shift
  - lengths.label_outline_offset_y
# Auto- or hand-placed by ChemDraw and context-dependent; starting defaults, not k-scaled.
approx:
  - text.line_pitch_sub_upper       # fitted from one pitch per preset (acs-style.md §3, Open 9)
  - text.line_pitch_sub_lower

# Hand-placed in the references: round user-chosen defaults on a 0.5 pt grid, each preset
# rounded from its own measured value (kept in the comment). Not k-scaled exactly.
placement:
  - charge.unlabeled_distance
  - charge.labeled_offset_x
  - charge.labeled_offset_y
  - charge.above_label
  - scheme.arrow_min_length
  - scheme.conditions_pad
  - scheme.multistep_indent
  - scheme.conditions_above_baseline
  - scheme.conditions_below_baseline
  - scheme.center_above_axis
  - scheme.arrow_gap
  - scheme.plus_gap
  - scheme.number_gap
  - lone_pair.gap
  - radical.distance
  - curved_arrow.tail_gap
  - curved_arrow.bond_tail_gap
  - curved_arrow.head_gap
  - curved_arrow.curvature          # dimensionless (control offset / chord), the same at every preset
  - curved_arrow.loop_curvature
  - resonance.arrow_length
  - resonance.arrow_gap
  - bracket.gap_x
  - bracket.gap_above
  - bracket.gap_below
  - scheme.row_gap

lengths:
  bond_length: 8.64                 # m1_set_x0.6: CDXML atom distances, median 8.640 (n=32)
  line_width: 0.60                  # m1_set_x0.6: bond polygon width, median 0.598 (n=44); exempt
  bond_spacing: 1.556               # m1_set_x0.6: ring double bonds, median 1.556 (n=6)
  ring_inner_inset: 0.899           # m1_set_x0.6: inner-line inset per end, median (n=12); = s*tan30
  bold_width: 1.2                   # m1_set_x0.6.cdxml BoldWidth
  wedge_wide_end: 1.802             # m1_set_x0.6: wedge polygon width at drawn end (to H label)
  hash_line_width: 0.60             # m1_set_x0.6: hash polygon thickness; exempt
  hash_spacing: 1.5                 # m1_set_x0.6.cdxml HashSpacing; drawn pitch 2.855 (rule OPEN)
  margin_width: 0.96                # m1_set_x0.6.cdxml MarginWidth; clip rule in acs-style.md §2.1
  label_outline_offset_x: -0.02      # measure_refs.py --fit-clip: glyph outline shift for clipping, all references (n=399)
  label_outline_offset_y: 0.03       # measure_refs.py --fit-clip

ratios:                             # dimensionless; identical in every preset
  bond_spacing_fraction: 0.18       # all files: CDXML BondSpacing=18; measured 2.592/14.40
  ring_inner_inset_tan: 0.5774      # tan 30deg; inset/spacing measured 1.497/2.592
  wedge_end_per_bold: 1.5           # m1_set_x*: 3.0/2.0, 2.4/1.6, 1.802/1.2
  label_clearance_per_margin: 1.0075 # measure_refs.py --fit-clip: gap beyond the glyph's reach along the bond / margin (n=399; 396 within 0.1 pt, worst of those 0.092, rms 0.055)
  label_band_per_size: 0.195        # measure_refs.py --fit-clip: only outline within +-0.195 x label size of the bond axis counts
  label_baseline_per_size: 0.3585   # all files: baseline - atom y = 3.586 at 10 pt (cap height/2)
  subscript_scale: 0.75             # all files: 7.5 pt digits under 10 pt labels
  subscript_drop_per_size: 0.23     # all files: 2.30 at 10 pt
  superscript_scale: 0.75           # scheme_multi_x*: '+' of H3O+ at 0.75 x size
  superscript_raise_per_size: 0.3586 # scheme_multi_x*: baseline raised 3.586 / 2.869 / 2.152
  arrow_back_control_per_half_width: 0.4375  # scheme_*: every arrowhead's back-edge cubic control sits at (notch, 0.4375 x corner offset)

angles:
  chain_angle: 120                  # m1_set_x1.0.cdxml ChainAngle; double_bonds_x1.0 hexane zigzag

text:
  label_size: 6                     # m1_set_x0.6 SVG font-size
  caption_size: 6                   # scheme_basic_x0.6 conditions / numbers
  number_weight: bold               # scheme_basic_x0.6 compound numbers font-weight="bold"
  line_pitch_extra: 0.05            # scheme_basic_x0.6: two-line conditions pitch 6.05
  line_pitch_sub_upper: 0.433       # approx: pitch adds this when the upper line has a subscript; scheme_multi_x0.6: 1,4-dioxane/H2O (4:1) -> 90 °C, 12 h pitch 6.483
  line_pitch_sub_lower: 0.10        # approx: ... and this when the lower line has one; scheme_multi_x0.6: PhB(OH)2 -> Pd(PPh3)4 pitch 6.583, minus the line above

charge:
  bar_length: 2.361                 # user decision 2026-10-24: proportional, x1.0 measured 3.935 x 0.6 (ChemDraw m1_set_x0.6 draws 1.798)
  bar_thickness: 0.50               # m1_set_x0.6; exempt
  unlabeled_distance: 3.0           # placement default (user decision 2026-10-25); measured resonance_x0.6 2.87 (at 0 / 180 / -90 deg, not the x1.0 bisectors; x1.0 3.84 x k = 2.30)
  labeled_offset_x: 1.0             # placement default (user decision 2026-10-24); x1.0 mean 1.77 x k = 1.06; ChemDraw m1_set_x0.6 N+ was (+1.78, -1.33) for its smaller sign
  labeled_offset_y: -1.0            # placement default (user decision 2026-10-24); x1.0 mean -1.75 x k = -1.05
  above_label: 4.5                  # placement default (user decision 2026-10-24); H on the right (NH3+); unmeasured at x0.6 (labels_x1.0 7.43 x k = 4.46)

arrow:                              # reaction / resonance arrows
  shaft_width: 0.60                 # scheme_basic_x0.6; exempt
  head_length: 6.0                  # scheme_basic_x0.6: 5.977; exempt
  head_half_width: 1.58             # scheme_basic_x0.6: mean 1.569; exempt
  head_inset: 5.25                  # scheme_basic_x0.6: 5.230; exempt
  shaft_end_from_tip: 5.21          # scheme_basic_x0.6: 5.180; exempt
  head_outline: 0.05                # scheme_basic_x0.6: hairline stroke over the fill; exempt

curved_arrow:                       # mech_basic_x0.6 (measure_refs.py --mech); exempt
  stroke_width: 0.60                # mech_basic_x0.6: stroked cubic
  head_length: 4.81                 # mech_basic_x0.6: 4.781, 4-vertex head polygon
  head_half_width: 1.50             # mech_basic_x0.6: 1.494
  head_inset: 4.06                  # mech_basic_x0.6: 4.034; the stroke ends at the notch
  fishhook_barb: 1.755              # mech_basic_x0.6: 1.734; 3-vertex half head
  fishhook_offset: 0.25             # mech_basic_x0.6: 0.241 (0.238-0.245); the stroke ends this far off the half head's axis, toward the barb
  tail_gap: 1.5                    # placement default (user decision 2026-10-24); lone-pair / radical tail: beyond the dots' outer edge, outward; measured 1.407
  bond_tail_gap: 1.5               # placement default (user decision 2026-10-24); bond tail: off the bond axis at its midpoint; measured 1.28 / 1.69, mean 1.49
  head_gap: 1.5                    # placement default (user decision 2026-10-24); tip -> target element ink box (unlabeled atom: its center; bond: its axis); measured 1.299; fishhooks: Cl 0.31, unlabeled C 0.56
  curvature: 0.5                    # placement default (user decision 2026-10-24); control offset / chord, arc shape; measured 0.531 (2e arrow, all presets)
  loop_curvature: 1.3               # placement default (user decision 2026-10-24); chords shorter than a bond: loop shape; measured 1.307-1.312 (fishhooks, all presets)

lone_pair:                          # mech_basic_x0.6; copied exactly, not k-scaled (nonlinear)
  dot_radius: 0.533                 # mech_basic_x0.6: circle paths, n=22 (lone pairs and radicals)
  dot_spacing: 2.40                # mech_basic_x0.6: center to center, n=10 pairs
  gap: 1.0                          # placement default (user decision 2026-10-24); dot edge -> element ink box; measured median 1.064 (n=10, 0.91-1.35)

radical:
  distance: 2.0                     # placement default (user decision 2026-10-24); dot center from an unlabeled atom; measured 1.802 (tert-butyl C, -88 deg); Cl radical: gap to ink box 1.28

bracket:                            # resonance_x0.6
  stroke_width: 0.60                # resonance_x0.6: stroked segments; exempt
  lip_length: 2.4                   # resonance_x0.6: 2.417 (x1.0 4.007 x k = 2.404)
  gap_x: 3.5                        # placement default (user decision 2026-10-25); content ink -> bracket stroke center, x; measured resonance_x0.6 3.433 (n=2, 3.37-3.50) (measure_refs.py --resonance)
  gap_above: 1.5                    # placement default (user decision 2026-10-25); bracket top (stroke center) above the content ink; measured resonance_x0.6 1.263
  gap_below: 1.0                    # placement default (user decision 2026-10-25); bracket bottom below the content ink; measured resonance_x0.6 1.042

resonance:                          # resonance_x0.6 (measure_refs.py --resonance); round defaults, see `placement`
  arrow_length: 17.5                # placement default (user decision 2026-10-25); double-headed arrow tip to tip; measured 17.28 (= 2 bond lengths)
  arrow_gap: 4.5                    # placement default (user decision 2026-10-25); contributor ink (incl. charges) <-> arrow tip; measured 4.548 (n=4, 3.94-4.61)

scheme:                             # hand-placed in the references (measure_refs.py --scheme); round defaults, see `placement`
  arrow_min_length: 23.5            # placement default (user decision 2026-10-24); measured scheme_multi_x0.6 shortest arrow (PCC / CH2Cl2) 23.72
  conditions_pad: 1.5               # placement default (user decision 2026-10-24); x1.0 2.327 x k = 1.40; the scaled references overhang (median 0.752, min -1.361) because ChemDraw scales text about its anchor
  multistep_indent: 2.0             # placement default (user decision 2026-10-24); measured scheme_multi_x0.6 1.918 / 1.924
  conditions_above_baseline: 3.5    # placement default (user decision 2026-10-24); measured scheme_*_x0.6 median 3.278 (n=6, 2.34-4.32)
  conditions_below_baseline: 7.0    # placement default (user decision 2026-10-24); measured scheme_*_x0.6 median 6.982 (n=6, 6.82-7.57)
  center_above_axis: 0.0            # placement default (user decision 2026-10-24); centered on the axis; measured 0.155 (rings), 0.153 ('+') = ChemDraw's arrow BoundingBox center
  arrow_gap: 8.0                    # placement default (user decision 2026-10-24); measured scheme_*_x0.6 median 7.819 (n=12, 6.04-13.23)
  plus_gap: 9.5                     # placement default (user decision 2026-10-24); measured scheme_basic_x0.6 both sides; scheme_* median 9.585 (n=4)
  number_gap: 4.0                   # placement default (user decision 2026-10-24); measured scheme_*_x0.6 median 3.945 (n=11, 3.84-3.99)
  row_gap: 21.0                     # placement default (user decision 2026-10-25); row ink bottom (incl. numbers) -> next row ink top (incl. conditions); measured scheme_wrap_x0.6 20.86 (measure_refs.py --wrap)
  wrap_width: 504.0                 # user decision 2026-10-25 (7 in, ACS double column); rows break between steps to stay within it; layout.width overrides
